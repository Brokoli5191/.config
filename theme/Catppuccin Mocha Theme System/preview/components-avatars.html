<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Components — Avatar & Presence</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .av { position: relative; width: 44px; height: 44px; }
  .av img, .av .ph {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid hsla(235,15%,53%,0.20);
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-2); font-size: 16px;
  }
  .dot {
    position: absolute; right: -2px; bottom: -2px;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #000;
  }
  .dot.online    { background: hsl(115,54%,76%); }
  .dot.idle      { background: hsl(41,86%,83%); }
  .dot.dnd       { background: hsl(343,81%,75%); }
  .dot.streaming { background: #b4befe; }
  .dot.offline   { background: #7f849c; }
  .lbl { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; text-align: center; text-transform: lowercase; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border: 1px solid transparent; transition: border-color 0.2s ease; }
  .person:hover { border-color: #b4befe; }
</style></head>
<body>
<div class="card">
  <div class="label">[ avatars · presence ]</div>
  <div class="row">
    <div class="person"><div class="av"><div class="ph">★</div><span class="dot online"></span></div><span class="lbl">online</span></div>
    <div class="person"><div class="av"><div class="ph">◆</div><span class="dot idle"></span></div><span class="lbl">idle</span></div>
    <div class="person"><div class="av"><div class="ph">▲</div><span class="dot dnd"></span></div><span class="lbl">dnd</span></div>
    <div class="person"><div class="av"><div class="ph">●</div><span class="dot streaming"></span></div><span class="lbl">streaming</span></div>
    <div class="person"><div class="av"><div class="ph">○</div><span class="dot offline"></span></div><span class="lbl">offline</span></div>
    <div class="person"><div class="av" style="width:32px;height:32px"><div class="ph" style="font-size:11px">a</div></div><span class="lbl">32px</span></div>
    <div class="person"><div class="av" style="width:24px;height:24px"><div class="ph" style="font-size:10px">b</div></div><span class="lbl">24px</span></div>
  </div>
  <div class="meta">avatars are the <em>only</em> circular shape in the system. presence dots are 12px with a 2px canvas-colored ring.</div>
</div>
</body></html>
